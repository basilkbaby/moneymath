<header class="header" [class.animate]="animate">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <a routerLink="/" class="logo-text">
          <span class="money">Money</span>
          <span class="plus">+</span>
          <span class="math">Math</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a routerLink="/" [class.active]="isActive('/')">Home</a></li>
          <li><a routerLink="/stamp-duty-calculator" [class.active]="isActive('/stamp-duty-calculator')">Stamp Duty</a></li>
          <li class="coming-soon">
            <a>Mortgage <span class="soon-badge">Coming Soon</span></a>
          </li>
          <li class="coming-soon">
            <a>Loan <span class="soon-badge">Coming Soon</span></a>
          </li>
          <li class="coming-soon">
            <a>Savings <span class="soon-badge">Coming Soon</span></a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
